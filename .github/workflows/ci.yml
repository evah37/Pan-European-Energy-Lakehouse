name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel previous runs on same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.9"

jobs:
  # 1: SQL Linting
  lint-sql:
    name: "SQL Lint (sqlfluff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install sqlfluff
        run: pip install sqlfluff sqlfluff-templater-dbt dbt-core==1.8.2 dbt-duckdb==1.8.2

      - name: Run sqlfluff lint
        run: |
          sqlfluff lint dbt_energy/models/ \
            --dialect duckdb \
            --exclude-rules LT05 \
            --ignore templating \
            || echo "::warning::sqlfluff found lint issues (non-blocking)"

  # 2: Python Linting
  lint-python:
    name: "Python Lint (flake8)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 dags/ scripts/ spark_jobs/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402 \
            --exclude=__pycache__

  # 3: Unit Tests (runs inside project Docker image)
  test-python:
    name: "Unit Tests (pytest)"
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4

      - name: Build Airflow test image
        run: docker build -t airflow-test ./containers/airflow/

      - name: Run tests in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/opt/airflow \
            -e AIRFLOW_HOME=/tmp/airflow \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/airflow.db \
            -e AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags \
            airflow-test bash -c "
              pip install --quiet pytest pytest-cov kafka-python &&
              airflow db init &&
              python -m pytest tests/ -v --tb=short --ignore=tests/dags -x &&
              python -m pytest tests/dags/ -v --tb=short
            "

  # 4: dbt Validation
  validate-dbt:
    name: "dbt Parse"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt
        run: pip install dbt-core==1.8.2 dbt-duckdb==1.8.2

      - name: dbt parse (syntax validation)
        run: |
          cd dbt_energy
          dbt parse --profiles-dir . --no-partial-parse
        env:
          DBT_PROFILES_DIR: ./dbt_energy

  # 5: Terraform Validation
  validate-terraform:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform
