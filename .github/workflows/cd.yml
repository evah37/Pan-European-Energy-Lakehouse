name: CD

on:
  push:
    tags:
      - "v*"      # Trigger on version tags
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  PYTHON_VERSION: "3.9"
  AZURE_RESOURCE_GROUP: "rg-pan-euro-energy"

jobs:
  # Run CI first 
  ci-check:
    name: "CI Gate"
    uses: ./.github/workflows/ci.yml

  # Build & push docker images
  build:
    name: "Build Docker Images"
    runs-on: ubuntu-latest
    needs: [ci-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Airflow image
        uses: docker/build-push-action@v5
        with:
          context: ./containers/airflow/
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/airflow:${{ github.sha }}
            ghcr.io/${{ github.repository }}/airflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Azure VM
  deploy:
    name: "Deploy to ${{ github.event.inputs.environment || 'staging' }}"
    runs-on: ubuntu-latest
    needs: [build]
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd ~/Pan-European-Energy-Lakehouse
            git pull origin main
            docker compose down --remove-orphans
            docker compose up airflow-init && docker compose up --build -d
            echo "Deployment completed at $(date)"

      - name: Health check
        run: |
          sleep 30
          curl --fail http://${{ secrets.AZURE_VM_HOST }}:8080/health || echo "::warning::Airflow health check failed"

      - name: Post-deploy notification
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
