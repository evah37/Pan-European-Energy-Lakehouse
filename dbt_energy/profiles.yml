energy_profile:
  target: dev
  outputs:
    dev:
      type: duckdb
      # local persistent database file, save metadata
      path: '/opt/airflow/dbt_energy/energy_wh.duckdb'
      
      # httpfs for S3 connection
      extensions:
        - httpfs
        - parquet
      
      # physical connection configuration
      settings:
        s3_region: us-east-1
        s3_endpoint: minio:9000
        s3_access_key_id: minio
        s3_secret_access_key: minio123
        # close SSL (local MinIO is http)
        s3_use_ssl: false
        s3_url_style: path
      
      # external table default output root path
      external_root: 's3://energy-lake/gold'